# 服务端口
server.port=8080
spring.application.name=team-rag-knowledge

# 阿里百炼 通用文本向量模型 text-embedding-v3
langchain4j.community.dashscope.embedding-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.embedding-model.model-name=text-embedding-v3
# 阿里百炼 通义千问大模型（流式输出）
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=qwen-plus
langchain4j.community.dashscope.streaming-chat-model.temperature=0.1 # 降低幻觉，保证回答准确性

# 日志配置
logging.level.root=info
logging.level.com.team.rag=debug

# Pinecone配置（从环境变量读取，避免硬编码）
pinecone.api-key=${PINECONE_API_KEY}
pinecone.index=${PINECONE_INDEX}
pinecone.region=${PINECONE_REGION}
pinecone.namespace=team-rag-namespace # 团队知识库专属命名空间

# 语义分块配置
rag.semantic-splitter.similarity-threshold=0.8 # 余弦相似度阈值，高于则合并
rag.semantic-splitter.max-tokens=1024 # 单块最大token数
rag.semantic-splitter.overlap-tokens=50 # 块间重叠token，保证上下文连贯

# 混合检索配置
rag.hybrid-retrieval.bm25-top-k=3 # BM25返回前3条
rag.hybrid-retrieval.vector-top-k=3 # 向量检索返回前3条
rag.hybrid-retrieval.final-top-k=3 # 混合后合并返回前3条
rag.vector-retrieval.min-score=0.8 # 向量检索最小相似度阈值，过滤低相关结果
