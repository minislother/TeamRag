server.port=8080
spring.application.name=team-rag-knowledge-base
spring.codec.max-in-memory-size=20MB
spring.servlet.multipart.max-file-size=${RAG_MAX_UPLOAD_SIZE_MB:50}MB
spring.servlet.multipart.max-request-size=${RAG_MAX_UPLOAD_SIZE_MB:50}MB

# Redis 短期记忆。未启动 Redis 时，服务会自动回退到进程内记忆，方便本地先跑通。
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s

# DashScope / 阿里百炼配置，兼容复用 RepoPilot 原 .env 中的 GLM 变量。
rag.dashscope.api-key=${DASH_SCOPE_API_KEY:${REPOPILOT_GLM_API_KEY:${GLM_API_KEY:${DASHSCOPE_API_KEY:}}}}
rag.dashscope.base-url=${DASH_SCOPE_API_BASE:${REPOPILOT_GLM_API_BASE:https://dashscope.aliyuncs.com/compatible-mode/v1}}
rag.dashscope.embedding-model=${DASH_SCOPE_EMBEDDING_MODEL:text-embedding-v3}
rag.dashscope.chat-model=${DASH_SCOPE_CHAT_MODEL:${REPOPILOT_GLM_MODEL:glm-5}}
rag.dashscope.embedding-dimensions=${DASH_SCOPE_EMBEDDING_DIMENSIONS:1024}
rag.dashscope.temperature=${DASH_SCOPE_TEMPERATURE:0.1}
rag.dashscope.stream-enabled=${DASH_SCOPE_STREAM_ENABLED:true}

# Pinecone 配置。Index 维度需要与 text-embedding-v3 保持 1024。
rag.pinecone.api-key=${PINECONE_API_KEY:}
rag.pinecone.index=${PINECONE_INDEX:}
rag.pinecone.region=${PINECONE_REGION:us-east-1}
rag.pinecone.host=${PINECONE_HOST:}
rag.pinecone.namespace=${PINECONE_NAMESPACE:team-rag-documents}
rag.pinecone.memory-namespace=${PINECONE_MEMORY_NAMESPACE:team-rag-memory}

# 文档解析和语义分块。
rag.document.max-upload-size-mb=${RAG_MAX_UPLOAD_SIZE_MB:50}
rag.document.storage-dir=${RAG_DOCUMENT_STORAGE_DIR:data/rag-documents}
rag.document-storage.type=${RAG_DOCUMENT_STORAGE_TYPE:local}
rag.document-storage.s3.endpoint=${RAG_S3_ENDPOINT:}
rag.document-storage.s3.region=${RAG_S3_REGION:us-east-1}
rag.document-storage.s3.bucket=${RAG_S3_BUCKET:}
rag.document-storage.s3.access-key=${RAG_S3_ACCESS_KEY:}
rag.document-storage.s3.secret-key=${RAG_S3_SECRET_KEY:}
rag.document-storage.s3.path-style-access=${RAG_S3_PATH_STYLE_ACCESS:true}
rag.document-storage.s3.prefix=${RAG_S3_PREFIX:rag-documents}
rag.semantic-splitter.similarity-threshold=${RAG_SEMANTIC_THRESHOLD:0.78}
rag.semantic-splitter.max-chars=${RAG_SEGMENT_MAX_CHARS:1800}
rag.semantic-splitter.overlap-chars=${RAG_SEGMENT_OVERLAP_CHARS:120}

# 混合检索。
rag.hybrid.top-k=${RAG_HYBRID_TOP_K:6}
rag.hybrid.alpha=${RAG_HYBRID_ALPHA:0.65}
rag.hybrid.min-score=${RAG_HYBRID_MIN_SCORE:0.0}

# 原始查询 + 改写查询的 RRF 融合。权重仅影响名次贡献，不直接相加异构检索分数。
rag.query-fusion.enabled=${RAG_QUERY_FUSION_ENABLED:true}
rag.query-fusion.original-weight=${RAG_QUERY_FUSION_ORIGINAL_WEIGHT:0.4}
rag.query-fusion.rewritten-weight=${RAG_QUERY_FUSION_REWRITTEN_WEIGHT:0.6}
rag.query-fusion.candidate-count=${RAG_QUERY_FUSION_CANDIDATE_COUNT:12}
rag.query-fusion.rrf-k=${RAG_QUERY_FUSION_RRF_K:60}

# 百炼原生文本重排，复用 DashScope API Key；与聊天 base URL 分开配置。
rag.rerank.enabled=${RAG_RERANK_ENABLED:true}
rag.rerank.model=${RAG_RERANK_MODEL:gte-rerank-v2}
rag.rerank.url=${RAG_RERANK_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
rag.rerank.candidate-count=${RAG_RERANK_CANDIDATE_COUNT:12}
rag.rerank.timeout-seconds=${RAG_RERANK_TIMEOUT_SECONDS:10}

# 短期记忆。
rag.memory.window-size=${RAG_MEMORY_WINDOW_SIZE:8}
rag.memory.summary-threshold=${RAG_MEMORY_SUMMARY_THRESHOLD:12}

# 文档生命周期仓储。默认 memory 方便本地启动；生产建议设置为 jdbc。
rag.lifecycle.repository=${RAG_LIFECYCLE_REPOSITORY:memory}
rag.datasource.url=${RAG_DB_URL:}
rag.datasource.username=${RAG_DB_USERNAME:}
rag.datasource.password=${RAG_DB_PASSWORD:}
rag.datasource.driver-class-name=${RAG_DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Document ingestion worker. It recovers PENDING/RUNNING jobs after restart.
rag.ingestion.recovery-enabled=${RAG_INGESTION_RECOVERY_ENABLED:true}
rag.ingestion.recovery-fixed-delay-ms=${RAG_INGESTION_RECOVERY_FIXED_DELAY_MS:30000}
rag.ingestion.recovery-initial-delay-ms=${RAG_INGESTION_RECOVERY_INITIAL_DELAY_MS:5000}
rag.ingestion.recovery-batch-size=${RAG_INGESTION_RECOVERY_BATCH_SIZE:20}

# Security. Keep disabled for local demos; enable and override every value in production.
rag.security.enabled=${RAG_SECURITY_ENABLED:false}
rag.security.token-secret=${RAG_SECURITY_TOKEN_SECRET:change-this-token-secret-before-production}
rag.security.token-ttl-minutes=${RAG_SECURITY_TOKEN_TTL_MINUTES:720}
rag.security.users=${RAG_SECURITY_USERS:admin:admin123:ADMIN:*}

logging.level.root=INFO
logging.level.com.team.rag=DEBUG

rag.semantic-splitter.max-tokens=${RAG_SEGMENT_MAX_TOKENS:500}
rag.semantic-splitter.overlap-tokens=${RAG_SEGMENT_OVERLAP_TOKENS:50}
rag.semantic-splitter.context-budget-tokens=${RAG_CONTEXT_BUDGET_TOKENS:3000}
