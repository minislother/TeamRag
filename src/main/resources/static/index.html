<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>团队 RAG 知识库</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=20260607-security1">
</head>
<body>
<div id="authGate" class="auth-gate" hidden>
    <form id="loginForm" class="login-card">
        <div class="brand-mark">RAG</div>
        <h2>登录团队知识库</h2>
        <p>请输入管理员分配的账号，系统会按项目权限隔离资料与问答结果。</p>
        <label>
            <span>用户名</span>
            <input id="loginUsername" name="username" type="text" autocomplete="username" required>
        </label>
        <label>
            <span>密码</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div id="loginError" class="login-error" role="alert"></div>
        <button id="loginButton" class="primary-button" type="submit">登录</button>
    </form>
</div>
<main class="app-shell">
    <aside class="knowledge-panel" aria-label="文档入库">
        <div class="brand-row">
            <div class="brand-mark">RAG</div>
            <div>
                <h1>团队知识库</h1>
                <p>文档入库与问答</p>
            </div>
        </div>
        <div id="authBar" class="auth-bar" hidden>
            <span id="currentUserText"></span>
            <button id="logoutButton" class="text-button" type="button">退出</button>
        </div>

        <form id="uploadForm" class="upload-form">
            <label class="field-label" for="documentFile">资料文件 <strong class="required-mark">*</strong></label>
            <input id="documentFile" name="file" type="file" class="file-input"
                   accept=".txt,.md,.pdf,.doc,.docx,.html,.htm" required>
            <input id="documentIdInput" name="documentId" type="hidden">
            <div id="updateTarget" class="update-target" hidden>
                <span id="updateTargetText"></span>
                <button id="clearUpdateTargetButton" type="button">取消</button>
            </div>

            <div class="form-grid">
                <label>
                    <span>文档类型 <em>可选</em></span>
                    <div class="combo" data-combo="docType">
                        <input id="docTypeInput" name="docType" type="text" placeholder="文档类型"
                               autocomplete="off" role="combobox" aria-expanded="false"
                               aria-controls="docTypeMenu">
                        <button class="icon-button combo-clear" id="docTypeClear" type="button" aria-label="清空文档类型"></button>
                        <button class="icon-button combo-toggle" id="docTypeToggle" type="button" aria-label="展开文档类型选项"></button>
                        <div id="docTypeMenu" class="combo-menu" role="listbox"></div>
                    </div>
                </label>
                <label>
                    <span>项目 <em>可选</em></span>
                    <div class="combo" data-combo="project">
                        <input id="projectInput" name="project" type="text" placeholder="项目"
                               autocomplete="off" role="combobox" aria-expanded="false"
                               aria-controls="projectMenu">
                        <button class="icon-button combo-clear" id="projectClear" type="button" aria-label="清空项目"></button>
                        <button class="icon-button combo-toggle" id="projectToggle" type="button" aria-label="展开项目选项"></button>
                        <div id="projectMenu" class="combo-menu" role="listbox"></div>
                    </div>
                </label>
            </div>

            <label>
                <span>标签 <em>可选</em></span>
                <div class="tag-picker" data-combo="tags">
                    <button id="tagPickerButton" class="tag-picker-trigger" type="button"
                            aria-expanded="false" aria-controls="tagMenu">
                        <span id="tagPickerSummary" class="tag-picker-summary">选择或新建标签</span>
                        <span class="combo-toggle-icon" aria-hidden="true"></span>
                    </button>
                    <div id="tagMenu" class="tag-panel" role="dialog" aria-label="选择或新建标签">
                        <section class="tag-panel-section">
                            <div class="tag-panel-title">已选标签</div>
                            <div id="tagChipList" class="tag-chip-list"></div>
                        </section>
                        <section class="tag-panel-section">
                            <div class="tag-panel-title">新建标签</div>
                            <div class="tag-create-row">
                                <input id="tagEntryInput" type="text" placeholder="输入标签名，例如：缓存"
                                       autocomplete="off">
                                <button id="tagCreateButton" class="tag-create-button" type="button">新建</button>
                            </div>
                        </section>
                        <section class="tag-panel-section">
                            <div class="tag-panel-title">已有标签</div>
                            <div id="tagOptionList" class="tag-option-list"></div>
                        </section>
                    </div>
                    <input id="tagsInput" name="tags" type="hidden">
                </div>
            </label>

            <label>
                <span>说明 <em>可选</em></span>
                <textarea name="description" rows="3" placeholder="简单描述这份资料的用途"></textarea>
            </label>

            <button class="primary-button" type="submit">
                <span class="button-icon" aria-hidden="true">↑</span>
                上传入库
            </button>
        </form>

        <div id="uploadStatus" class="status-box" role="status" aria-live="polite">
            等待上传资料
        </div>

        <section class="documents-block" aria-label="文档状态">
            <div class="section-heading">
                <h2>文档状态</h2>
                <button id="refreshDocumentsButton" class="text-button" type="button">刷新</button>
            </div>
            <div id="documentList" class="document-list">
                <div class="empty-state">暂无入库文档</div>
            </div>
        </section>

        <div class="settings-block">
            <h2>会话设置</h2>
            <label>
                <span class="label-with-tip">
                    会话 ID
                    <span class="tooltip" tabindex="0" role="button"
                          aria-label="同一 ID 会保留连续追问的上下文；换一个 ID 就相当于开启新会话。"
                          data-tooltip="同一 ID 会保留连续追问的上下文；换一个 ID 就相当于开启新会话。">
                        <span class="tooltip-icon" aria-hidden="true">i</span>
                    </span>
                </span>
                <input id="conversationInput" type="text" value="1" autocomplete="off">
            </label>
            <label>
                <span class="label-with-tip">
                    召回数量
                    <span class="tooltip" tabindex="0" role="button"
                          aria-label="每次提问最多从知识库取多少个相关片段；默认 6，复杂问题可适当调大。"
                          data-tooltip="每次提问最多从知识库取多少个相关片段；默认 6，复杂问题可适当调大。">
                        <span class="tooltip-icon" aria-hidden="true">i</span>
                    </span>
                </span>
                <input id="topKInput" type="number" value="6" min="1" max="20">
            </label>
        </div>
    </aside>

    <section class="chat-panel" aria-label="RAG 问答">
        <header class="chat-header">
            <div>
                <h2>问答</h2>
                <div id="runtimeInfo" class="model-strip" aria-label="当前模型配置">
                    <span class="model-pill">
                        <span class="model-label">Embedding</span>
                        <strong>text-embedding-v3</strong>
                    </span>
                    <span class="model-pill accent">
                        <span class="model-label">Chat</span>
                        <strong>glm-5</strong>
                    </span>
                </div>
            </div>
            <button id="clearButton" class="secondary-button" type="button">
                <span class="button-icon" aria-hidden="true">×</span>
                清空
            </button>
        </header>

        <div id="messageList" class="message-list" aria-live="polite">
            <article class="message assistant">
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <p>你可以先上传团队资料，再直接用自然语言提问。</p>
                </div>
            </article>
        </div>

        <form id="chatForm" class="chat-composer">
            <label class="sr-only" for="questionInput">问题</label>
            <textarea id="questionInput" rows="2" placeholder="输入你的问题"></textarea>
            <div class="composer-actions">
                <button id="stopButton" class="secondary-button" type="button" disabled>
                    <span class="button-icon" aria-hidden="true">■</span>
                    停止
                </button>
                <button id="sendButton" class="primary-button" type="submit">
                    <span class="button-icon" aria-hidden="true">→</span>
                    发送
                </button>
            </div>
        </form>
    </section>
</main>

<script src="/app.js?v=20260607-security1"></script>
</body>
</html>
